name: Atualizar dados das salas

on:
  repository_dispatch:
    types: [atualizar-dados]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

           - name: Baixar dados atualizados do OneDrive
        env:
          URL: ${{ github.event.client_payload.url }}
        run: |
          echo "Baixando arquivo compartilhado..."
          curl -L \
            -A "Mozilla/5.0" \
            -H "Accept: application/octet-stream" \
            --fail-with-body \
            "$URL" \
            -o dados-novos.json

      - name: Validar arquivo JSON
        run: |
          jq empty dados-novos.json
          mv dados-novos.json dados.json

      - name: Salvar alteração
        run: |
          git config user.name "Power Automate"
          git config user.email "powerautomate@domhelder.edu.br"
          git add dados.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualização automática da distribuição de salas"
          git push
