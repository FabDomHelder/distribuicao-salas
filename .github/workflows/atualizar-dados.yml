name: Atualizar dados das salas

on:
  repository_dispatch:
    types: [atualizar-dados]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar dados.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s\n' "$PAYLOAD" > dados.json

      - name: Salvar alteração
        run: |
          git config user.name "Power Automate"
          git config user.email "powerautomate@domhelder.edu.br"
          git add dados.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualização automática da distribuição de salas"
          git push
