name: Atualizar dados das salas

on:
  repository_dispatch:
    types: [atualizar-dados-parte]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "Power Automate"
          git config user.email "powerautomate@domhelder.edu.br"

      - name: Sincronizar repositório
        run: |
          git pull --rebase origin main

      - name: Identificar parte recebida
        id: parte
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          CHUNK=$(printf '%s' "$PAYLOAD" | jq -r '.chunk')
          TOTAL=$(printf '%s' "$PAYLOAD" | jq -r '.total')

          echo "chunk=$CHUNK" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          echo "Parte recebida: $CHUNK"
          echo "Total esperado: $TOTAL"

          if ! [[ "$CHUNK" =~ ^[1-5]$ ]]; then
            echo "ERRO: chunk inválido: $CHUNK"
            exit 1
          fi

      - name: Salvar parte recebida
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          CHUNK: ${{ steps.parte.outputs.chunk }}
        run: |
          mkdir -p .dados-partes
          printf '%s\n' "$PAYLOAD" > ".dados-partes/parte-${CHUNK}.json"

          echo "Parte $CHUNK salva."
          ls -la .dados-partes/

      - name: Publicar parte recebida
        env:
          CHUNK: ${{ steps.parte.outputs.chunk }}
        run: |
          for TENTATIVA in 1 2 3 4 5; do
            echo "Tentativa $TENTATIVA de publicar parte $CHUNK..."

            git fetch origin main
            git reset --hard origin/main

            mkdir -p .dados-partes

            PAYLOAD='${{ toJson(github.event.client_payload) }}'
            printf '%s\n' "$PAYLOAD" > ".dados-partes/parte-${CHUNK}.json"

            git add ".dados-partes/parte-${CHUNK}.json"

            if git diff --cached --quiet; then
              echo "Parte $CHUNK já está publicada."
              break
            fi

            git commit -m "Receber parte $CHUNK da distribuição de salas"

            if git push origin main; then
              echo "Parte $CHUNK publicada com sucesso."
              break
            fi

            echo "Outro processo atualizou a branch. Tentando novamente..."
            sleep 3
          done

      - name: Aguardar partes anteriores
        if: steps.parte.outputs.chunk == '5'
        run: |
          echo "Última parte recebida. Aguardando sincronização das demais partes..."
          sleep 15

      - name: Atualizar repositório para montagem
        if: steps.parte.outputs.chunk == '5'
        run: |
          git fetch origin main
          git reset --hard origin/main

          echo "Partes disponíveis:"
          ls -la .dados-partes/ || true

      - name: Verificar cinco partes
        if: steps.parte.outputs.chunk == '5'
        id: verificar
        run: |
          FALTANDO=0

          for N in 1 2 3 4 5; do
            if [ ! -f ".dados-partes/parte-${N}.json" ]; then
              echo "Faltando parte $N"
              FALTANDO=1
            else
              echo "Parte $N encontrada"
            fi
          done

          if [ "$FALTANDO" -eq 0 ]; then
            echo "completo=true" >> "$GITHUB_OUTPUT"
          else
            echo "completo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aguardar partes faltantes
        if: steps.parte.outputs.chunk == '5' && steps.verificar.outputs.completo != 'true'
        run: |
          echo "Nem todas as partes chegaram. Aguardando mais 20 segundos..."
          sleep 20

          git fetch origin main
          git reset --hard origin/main

          for N in 1 2 3 4 5; do
            if [ ! -f ".dados-partes/parte-${N}.json" ]; then
              echo "ERRO: parte $N ainda está faltando."
              exit 1
            fi
          done

      - name: Montar dados.json
        if: steps.parte.outputs.chunk == '5'
        run: |
          jq -s '
          {
            semestre: .[0].semestre,
            atualizadoEm: (now | todate),

            salas: (
              .[0].salas
              | map({
                  "Prédio": .["Prédio"],
                  "Andar": .["Andar"],
                  "Sala/Laboratório": .["Sala"]
                })
            ),

            records: (
              [.[].records[]]
              | map({
                  "Curso": .["Curso"],
                  "Turno": .["Turno"],
                  "Período": .["Período"],
                  "Turma": .["Turma"],
                  "Dia": .["Dia"],
                  "Início": .["Início"],
                  "Fim": .["Fim"],
                  "Disciplina": .["Disciplina"],
                  "Sala/Laboratório": .["Sala"],
                  "Prédio": .["Prédio"],
                  "Andar": .["Andar"],
                  "Professor": .["Professor"],
                  "Observação": .["Observação"],
                  "Fonte": .["Fonte"]
                })
            )
          }
          ' \
          .dados-partes/parte-1.json \
          .dados-partes/parte-2.json \
          .dados-partes/parte-3.json \
          .dados-partes/parte-4.json \
          .dados-partes/parte-5.json \
          > dados-novos.json

          jq empty dados-novos.json

          echo "Quantidade de salas:"
          jq '.salas | length' dados-novos.json

          echo "Quantidade de registros:"
          jq '.records | length' dados-novos.json

          echo "Exemplo de sala:"
          jq '.salas[0]' dados-novos.json

          echo "Exemplo de registro:"
          jq '.records[0]' dados-novos.json

          mv dados-novos.json dados.json

      - name: Publicar atualização final
        if: steps.parte.outputs.chunk == '5'
        run: |
          cp dados.json /tmp/dados-final.json

          for TENTATIVA in 1 2 3 4 5; do
            echo "Tentativa de publicação final $TENTATIVA de 5..."

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/dados-final.json dados.json
            rm -rf .dados-partes

            git add -A

            if git diff --cached --quiet; then
              echo "Nenhuma alteração final necessária."
              break
            fi

            git commit -m "Atualização automática da distribuição de salas"

            if git push origin main; then
              echo "Atualização final publicada com sucesso."
              break
            fi

            echo "Outro processo atualizou a branch. Nova tentativa..."
            sleep 3
          done
